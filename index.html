  <!-- Inline Theme: Prevent Flash of Unstyled Content (FOUC) -->
  <!-- Reads SITE_CONFIG.themes.classes; with no config there is nothing to
       apply, so the page stays on the :root defaults -->
  <script>
    try {
      var t = parseInt(localStorage.getItem("MH_THEME_INDEX"), 10);
      if (!isFinite(t)) t = 0;
      var THEME_CLASSES = (typeof SITE_CONFIG !== "undefined" && SITE_CONFIG.themes && SITE_CONFIG.themes.classes)
        ? SITE_CONFIG.themes.classes
        : [];
      if (THEME_CLASSES[t]) document.documentElement.classList.add(THEME_CLASSES[t]);
    } catch(e) {}
  </script>

  <!-- Pinned to 1.0.12 for reproducible builds; use the jsdelivr URLs when deploying overseas -->
  <!-- Injected after DOMContentLoaded so first paint never waits on third parties -->
  <script>
    window.addEventListener("DOMContentLoaded", function () {
      // Add entries here (tag + attributes) to bring in your own analytics,
      // chat widget or any other non-critical third-party asset.
      var EXTERNALS = [
        { tag: "link", attrs: { rel: "stylesheet", href: "https://registry.npmmirror.com/weblive2d/1.0.12/files/waifu.css" } },
        { tag: "script", attrs: { src: "https://registry.npmmirror.com/weblive2d/1.0.12/files/js/autoload.js" } },
        { tag: "script", attrs: { src: "https://insight.masterhu.com.cn/tracker.js" } }
      ];
      EXTERNALS.forEach(function (item) {
        var node = document.createElement(item.tag);
        if (item.tag === "script") node.async = true;
        Object.keys(item.attrs).forEach(function (name) {
          node.setAttribute(name, item.attrs[name]);
        });
        document.head.appendChild(node);
      });
    });
  </script>
